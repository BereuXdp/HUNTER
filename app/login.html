<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · Hunter</title>
<meta name="theme-color" content="#EFE6D7">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/hunter.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE6D7; --card:#F8F2E7; --sand:#E5DAC8;
  --ink:#0E1D21; --deep:#122E34; --petrol:#224347; --slate:#677E8A; --mist:#ABAFB5;
  --line:rgba(14,29,33,.14); --muted:rgba(14,29,33,.66);
  --danger:#8A2B1E; --danger-bg:#F3DCD5; --focus:#224347;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.7,.2,1); --r:18px;
  --gut:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:minmax(0,1fr); justify-items:center; align-content:center;
  min-height:100vh; min-height:100dvh;
  padding:var(--gut);
}
.card{
  width:100%; max-width:400px;
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:clamp(24px,5vw,36px);
  box-shadow:0 1px 0 rgba(14,29,33,.04), 0 18px 40px -24px rgba(14,29,33,.28);
  animation:rise .5s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.brand img{width:36px;height:36px;border-radius:9px;display:block}
.brand span{font-weight:600;font-size:18px;letter-spacing:-.01em}
.eyebrow{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin:0 0 8px;
}
h1{font-size:26px; line-height:1.2; letter-spacing:-.02em; margin:0 0 6px; font-weight:700}
.lede{margin:0 0 24px; color:var(--muted); font-size:15px}
.alert{
  display:none; background:var(--danger-bg); color:var(--danger);
  border-radius:12px; padding:11px 14px; font-size:14px; margin:0 0 18px;
}
.alert.show{display:block}
.alert.ok{background:var(--sand); color:var(--ink)}
form{display:grid; gap:16px}
.field{display:grid; gap:6px}
label{font-size:14px; font-weight:500}
input[type="email"],input[type="password"],input[type="text"]{
  width:100%; min-width:0; font:inherit; font-size:16px; /* 16px evita zoom no iOS */
  color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  transition:border-color .2s, box-shadow .2s;
}
input::placeholder{color:var(--mist)}
input:focus-visible{outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(34,67,71,.22)}
input[aria-invalid="true"]{border-color:var(--danger)}
.pwd{position:relative}
.pwd input{padding-right:64px}
.toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:0; font:inherit; font-size:13px; font-weight:500;
  color:var(--petrol); padding:8px 10px; border-radius:8px; cursor:pointer;
}
.toggle:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
.error{font-size:13px; color:var(--danger); min-height:0; margin:0}
.error:empty{display:none}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:14px}
.check{display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer}
.check input{width:18px; height:18px; accent-color:var(--petrol); margin:0}
a{color:var(--petrol); text-decoration:underline; text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
button.primary{
  font:inherit; font-weight:600; font-size:16px; color:var(--card);
  background:var(--ink); border:0; border-radius:999px; padding:14px 20px;
  cursor:pointer; min-height:48px; transition:opacity .2s, transform .15s var(--ease);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
button.primary:hover{opacity:.9}
button.primary:active{transform:scale(.99)}
button.primary:disabled{opacity:.6; cursor:progress}
button.primary:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
.spin{
  width:16px; height:16px; border-radius:50%; border:2px solid currentColor;
  border-right-color:transparent; display:none; animation:spin .8s linear infinite;
}
button.primary.loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin:24px 0 0; text-align:center; font-size:13px; color:var(--muted)}
.foot a{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<main class="card">
  <div class="brand">
    <img src="assets/hunter.svg" alt="" width="36" height="36">
    <span>Hunter</span>
  </div>

  <p class="eyebrow">Área do cliente</p>
  <h1>Entrar</h1>
  <p class="lede">Acesse as lojas da sua rede e os XMLs do mês.</p>

  <div id="alert" class="alert" role="alert"></div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email"
             placeholder="voce@suaempresa.com.br" required aria-describedby="email-error">
      <p id="email-error" class="error" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <div class="pwd">
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="Sua senha" required aria-describedby="password-error">
        <button type="button" class="toggle" id="toggle-pwd" aria-controls="password"
                aria-pressed="false">Mostrar</button>
      </div>
      <p id="password-error" class="error" aria-live="polite"></p>
    </div>

    <div class="row">
      <label class="check">
        <input type="checkbox" id="remember" name="remember">
        Manter conectado
      </label>
      <a href="#" id="forgot">Esqueci a senha</a>
    </div>

    <button type="submit" class="primary" id="submit">
      <span class="spin" aria-hidden="true"></span>
      <span id="submit-label">Entrar</span>
    </button>
  </form>

  <p class="foot">Ainda não tem conta? <a href="../site/index.html">Conheça o Hunter</a></p>
</main>

<script src="js/login.js" defer></script>
</body>
</html>
